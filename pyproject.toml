[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plaud-notes-mcp"
version = "0.2.0"
description = "MCP server to connect Plaud Notes to Claude. Team fork: OAuth 2.1 + per-user tokens in Firestore."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=3.2.4,<4",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
cli = ["mcp[cli]>=1.0.0"]
team = [
    "google-cloud-firestore>=2.18.0",
    "google-cloud-kms>=3.0.0",
    "google-cloud-monitoring>=2.20.0",
    "jinja2>=3.1.0",
    "starlette>=0.36.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.0",
    "httpx>=0.27.0",
]

[project.scripts]
plaud-notes-mcp = "plaud_notes_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
